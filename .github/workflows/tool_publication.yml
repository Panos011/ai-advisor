name: Advisor tool publication sync

on:
  repository_dispatch:
    types: [advisor-tool-upserted, advisor-catalog-backfill-requested]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advisor-dataset-writes

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare the newest catalogue publication
        id: payload
        env:
          CLIENT_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJson(github.event.client_payload) || '' }}
        run: |
          python Catalog_Publication_Poll.py \
            --payload /tmp/publication_payload.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Normalise the private embedding credential
        if: steps.payload.outputs.needs_sync == 'true'
        run: python Normalise_Workflow_Key.py

      - name: Download the canonical dataset
        if: steps.payload.outputs.needs_sync == 'true'
        run: |
          git lfs install
          git lfs pull

      - name: Install publication dependencies
        if: steps.payload.outputs.needs_sync == 'true'
        run: |
          pip install -r requirements.runtime.txt pandas firebase-admin

      - name: Apply publication and rebuild retrieval indexes
        if: steps.payload.outputs.needs_sync == 'true'
        run: |
          python Apply_Publications.py --payload /tmp/publication_payload.json
          python Data_Cleaning.py
          python Index.py

      - name: Commit and push the rebuilt dataset
        if: steps.payload.outputs.needs_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AI_tools.csv Clean_AI_tools.csv Embeddings_AI_tools.csv index/
          if ! git diff --cached --quiet; then
            git commit -m "Publish CommAI catalogue to Advisor"
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push origin main
          else
            echo "Advisor dataset already matches this publication."
          fi

      - name: Verify the rebuilt index reached production
        id: production
        if: steps.payload.outputs.needs_sync == 'true'
        run: |
          python Wait_For_Advisor_Deploy.py \
            --manifest index/index_manifest.json \
            --timeout 1200 \
            --initial-delay 60

      - name: Settle CommAI publication readiness
        if: always() && steps.payload.outputs.needs_sync == 'true'
        run: |
          pip install firebase-admin
          python Advisor_Publication_Callback.py \
            --payload /tmp/publication_payload.json \
            --outcome "${{ steps.production.outcome }}" \
            --error "Advisor dataset rebuild or production verification failed. Inspect GitHub run ${{ github.run_id }}."
