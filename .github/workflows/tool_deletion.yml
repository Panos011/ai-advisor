name: Advisor tool deletion sync

# Fired by the Firebase admin functions (adminDeleteTool /
# adminPermanentlyDeleteTool / adminRestoreTool) via repository_dispatch.
on:
  repository_dispatch:
    types: [advisor-tool-deleted, advisor-tool-restored]

permissions:
  contents: write

# Serialise with the biweekly refresh so the two never clobber each other.
concurrency:
  group: advisor-dataset-writes

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Git LFS install
        run: git lfs install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write dispatch payload
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: printf '%s' "$CLIENT_PAYLOAD" > /tmp/client_payload.json

      - name: Apply deletion / restore to dataset files
        id: apply
        run: python Apply_Deletions.py --payload /tmp/client_payload.json

      - name: Install dependencies for index rebuild
        if: steps.apply.outputs.dataset_changed == 'true'
        run: pip install -r requirements.txt

      - name: Rebuild FAISS index without the deleted tool
        if: steps.apply.outputs.dataset_changed == 'true'
        run: python Index.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add AI_tools.csv Clean_AI_tools.csv Embeddings_AI_tools.csv deleted_tools.json index/

          if ! git diff --cached --quiet; then
            git commit -m "Apply advisor dataset ${{ github.event.action }}"
          else
            echo "No changes to commit"
            exit 0
          fi

          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push origin main
