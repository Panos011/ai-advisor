name: Build advisor capability-claim index

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advisor-dataset-writes

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install index dependencies
        run: pip install "numpy<2" "faiss-cpu==1.9.0.post1" "openai>=2.2,<3" python-dotenv

      - name: Build source-backed capability-claim index
        if: env.OPENAI_API_KEY != ''
        run: python Build_Claim_Index.py

      - name: Commit and push claim artifacts
        if: env.OPENAI_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index/claims.faiss index/claims_meta.jsonl index/claims_manifest.json
          if git diff --cached --quiet; then
            echo "Claim index is already current."
            exit 0
          fi
          git commit -m "Build open-vocabulary advisor claim index"
          git fetch origin main
          git rebase origin/main
          git push origin main

      # This workflow is workflow_dispatch only, so a run is always an explicit
      # request to build the index. Skipping every real step and still reporting
      # success made that request look honoured when nothing had been produced:
      # two dispatches on 2026-07-26 went green while the semantic index was
      # never built, and production stayed on the lexical fallback unnoticed.
      # Fail instead — a request that could not be carried out is not a success.
      - name: Fail when the claim index cannot be built
        if: env.OPENAI_API_KEY == ''
        run: |
          echo "::error title=Claim index not built::OPENAI_API_KEY is not configured in this repository's Actions secrets, so no semantic claim index was produced. The advisor keeps serving the built-in lexical claim fallback. Add the secret, then re-run this workflow."
          exit 1
