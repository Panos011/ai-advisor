# Build and deploy the advisor API to Cloud Run.
#
# Replaces the push-to-deploy behaviour that was lost when the backend moved off
# Render. Without this, a push to main changes nothing in production until
# someone remembers to run `gcloud run deploy` by hand.
#
# Every image is tagged with the commit SHA as well as :latest, so a bad deploy
# can be identified and rolled back to a specific commit rather than a revision
# number nobody can map back to code.

substitutions:
  _SERVICE: commai-advisor
  _REGION: us-central1
  _RUNTIME_SA: commai-advisor-runtime@ai-discovery-platform.iam.gserviceaccount.com
  # Literal rather than ${PROJECT_ID}: nested substitution inside a
  # substitution value fails at build time, not at trigger-creation time, which
  # is the worst place to discover it.
  _IMAGE: us-central1-docker.pkg.dev/ai-discovery-platform/cloud-run-source-deploy/commai-advisor

steps:
  # Runs before anything is built. GitHub Actions runs the same suite, but
  # Actions cannot stop this pipeline — a red check and a deployed regression
  # would happen in parallel. Gating here is what actually protects production.
  # The whole suite takes ~2s; the pip install dominates, and that is still a
  # cheap insurance premium on an automatic push-to-production path.
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --no-cache-dir -r requirements.runtime.txt pytest
        pytest tests/ -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:${SHORT_SHA}
      - --tag=${_IMAGE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_IMAGE}"]

  # Deployed by digest-free SHA tag so the revision is traceable to a commit.
  # Flags mirror the manual deploy: 2Gi because the FAISS index is held in
  # memory, one worker for the same reason, and the OpenAI key comes from
  # Secret Manager rather than the environment.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=1
      - --timeout=300
      - --concurrency=40
      - --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest
      - --set-env-vars=CHAT_MODEL=gpt-5.4-mini,EMB_MODEL=text-embedding-3-small

  # Fail the build if the deployed revision cannot serve, so a broken image is
  # visible in Cloud Build rather than only in user-facing errors. Cloud Run
  # keeps the previous revision serving when a new one never becomes ready.
  - id: verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # A service that has ever been deployed with --no-traffic stops routing
        # to LATEST and stays pinned to whichever revision was current. Every
        # later deploy then creates a revision serving 0% while the build, the
        # deploy step and the health check below all still pass, because they
        # inspect the service URL — which is answering from the pinned old
        # revision. That is a deploy pipeline that reports success and ships
        # nothing, so check the invariant rather than trusting it.
        # Tagged revisions add their own traffic entries, so this is a list
        # ("True;;" with two tags present) rather than a single value — match
        # any entry routing to LATEST instead of comparing the whole string.
        if ! gcloud run services describe ${_SERVICE} --region ${_REGION} \
          --format='value(spec.traffic.latestRevision)' | grep -q True; then
          echo "Service is pinned to a specific revision and is NOT serving LATEST." >&2
          echo "This build deployed a revision that no user will reach. Fix with:" >&2
          echo "  gcloud run services update-traffic ${_SERVICE} --region ${_REGION} --to-latest" >&2
          exit 1
        fi
        url=$(gcloud run services describe ${_SERVICE} --region ${_REGION} \
          --format='value(status.url)')
        echo "Verifying $${url}/health"
        for attempt in 1 2 3 4 5; do
          if curl -fsS --max-time 60 "$${url}/health" -o /tmp/health.json; then
            cat /tmp/health.json
            python3 -c "
        import json,sys
        d=json.load(open('/tmp/health.json'))
        assert d.get('ok') is True, 'health not ok'
        assert d.get('items',0) > 0, 'no catalogue items loaded'
        assert d.get('vectors_loaded') is True, 'tool vectors did not load'
        print('health OK: %s items' % d['items'])
        "
            exit 0
          fi
          echo "attempt $${attempt} failed; retrying"
          sleep 10
        done
        echo "Deployed revision never became healthy" >&2
        exit 1

images:
  - ${_IMAGE}:${SHORT_SHA}
  - ${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
